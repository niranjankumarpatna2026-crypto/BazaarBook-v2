<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — BazaarBook</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #fafaf9, #f5f3ff);
      color: #0f172a;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: white;
      border-radius: 28px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px -5px rgb(124 58 237 / 0.15);
      border: 1px solid #e7e5e4;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 28px;
      background: linear-gradient(135deg, #7c3aed, #f97316);
      display: grid;
      place-items: center;
      font-size: 40px;
      box-shadow: 0 10px 25px -5px rgb(124 58 237 / 0.3);
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p { color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    button {
      width: 100%;
      padding: 14px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #6d28d9; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #fef3c7;
      color: #92400e;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <div class="badge">Offline mode</div>
    <h1>Internet nahi hai</h1>
    <p>
      Aap offline hain, phir bhi <strong>BazaarBook</strong> aapke saath hai.
      Cached data dekha ja sakta hai — internet aate hi sab sync ho jayega.
    </p>
    <button onclick="location.reload()">🔄 Dobara koshish karein</button>
  </div>
  <script>
    window.addEventListener('online', () => setTimeout(() => location.reload(), 500));
  </script>
</body>
</html>
